name: hackathon-check-in-app
services:
  blaze:
    image: samply/blaze:1.11.0
    restart: unless-stopped
    # Blaze has no authentication enabled: never publish this port beyond loopback.
    ports:
      - "127.0.0.1:8090:8080"
    environment:
      BASE_URL: http://localhost:8090
      JAVA_TOOL_OPTIONS: -Xmx2g
      DB_BLOCK_CACHE_SIZE: 256
      ENFORCE_REFERENTIAL_INTEGRITY: "true"
      LOG_LEVEL: info
    volumes:
      # Database files live on the host disk, not inside the container or a Docker volume.
      - type: bind
        source: ${BLAZE_DATA_DIR:?Set BLAZE_DATA_DIR in .env to the existing Blaze data directory}
        target: /app/data
        bind:
          create_host_path: false
    healthcheck:
      test: ["CMD", "wget", "--spider", "-q", "http://localhost:8080/health"]
      interval: 10s
      timeout: 5s
      retries: 10
      start_period: 60s
    stop_grace_period: 60s
